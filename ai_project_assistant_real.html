
<style>
*{margin:0;padding:0;box-sizing:border-box}
.wrap{font-family:var(--font-sans);height:700px;display:flex;flex-direction:column;border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-lg);overflow:hidden}
.setup{padding:32px;display:flex;flex-direction:column;gap:16px;background:var(--color-background-primary)}
.setup h2{font-size:16px;font-weight:500;color:var(--color-text-primary)}
.setup p{font-size:13px;color:var(--color-text-secondary);line-height:1.6}
.setup input{width:100%;padding:10px 14px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
.setup input:focus{border-color:var(--color-border-primary)}
.setup button{padding:10px 20px;font-size:13px;border:none;border-radius:var(--border-radius-md);background:var(--color-text-primary);color:var(--color-background-primary);cursor:pointer;align-self:flex-start}
.note{padding:10px 14px;background:var(--color-background-warning);border-radius:var(--border-radius-md);font-size:12px;color:var(--color-text-warning)}
.app{display:flex;flex:1;overflow:hidden}
.sidebar{width:190px;min-width:190px;background:var(--color-background-secondary);border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;overflow:hidden}
.slogo{padding:14px 12px;font-size:14px;font-weight:500;border-bottom:0.5px solid var(--color-border-tertiary);color:var(--color-text-primary)}
.slabel{font-size:10px;color:var(--color-text-tertiary);padding:10px 12px 4px;letter-spacing:0.08em;text-transform:uppercase}
.sitem{padding:7px 10px;font-size:12px;cursor:pointer;border-radius:6px;margin:1px 6px;color:var(--color-text-secondary)}
.sitem:hover{background:var(--color-background-primary);color:var(--color-text-primary)}
.sitem.active{background:var(--color-background-primary);color:var(--color-text-primary);font-weight:500}
.snew{margin:8px;padding:7px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:transparent;cursor:pointer;color:var(--color-text-secondary);width:calc(100% - 16px)}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;gap:3px;padding:8px 10px;border-bottom:0.5px solid var(--color-border-tertiary);background:var(--color-background-secondary)}
.tab{padding:5px 10px;font-size:12px;border:0.5px solid transparent;border-radius:6px;cursor:pointer;color:var(--color-text-secondary);background:transparent}
.tab.active{background:var(--color-background-primary);color:var(--color-text-primary);border-color:var(--color-border-secondary);font-weight:500}
.content{flex:1;display:flex;flex-direction:column;overflow:hidden}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;gap:8px}
.msg.u{flex-direction:row-reverse}
.av{width:26px;height:26px;min-width:26px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500}
.av.u{background:var(--color-background-info);color:var(--color-text-info)}
.av.a{background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary)}
.bub{padding:9px 13px;border-radius:10px;font-size:13px;line-height:1.6;max-width:88%;color:var(--color-text-primary);white-space:pre-wrap}
.bub.u{background:var(--color-background-info);border-radius:10px 3px 10px 10px}
.bub.a{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:3px 10px 10px 10px}
.tbadge{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:100px;font-size:10px;background:var(--color-background-secondary);border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);margin:4px 3px 0 0}
.iarea{padding:10px 12px;border-top:0.5px solid var(--color-border-tertiary);display:flex;gap:8px;background:var(--color-background-primary)}
.cinput{flex:1;padding:8px 12px;font-size:13px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;font-family:var(--font-sans);resize:none}
.sbtn{padding:8px 14px;background:var(--color-text-primary);color:var(--color-background-primary);border:none;border-radius:8px;cursor:pointer;font-size:13px;font-family:var(--font-sans)}
.sbtn:disabled{opacity:0.35;cursor:not-allowed}
.dot{width:5px;height:5px;border-radius:50%;background:var(--color-text-tertiary);animation:bl 1.2s infinite;display:inline-block;margin:0 1px}
.dot:nth-child(2){animation-delay:.2s}.dot:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:1}30%{opacity:0.15}}
.panel{padding:16px;overflow-y:auto;flex:1}
.ptop{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.ptitle{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.igrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.icard{border:0.5px solid var(--color-border-tertiary);border-radius:8px;overflow:hidden}
.icard img{width:100%;aspect-ratio:1;object-fit:cover;display:block;background:var(--color-background-secondary)}
.ibody{padding:7px;font-size:11px;color:var(--color-text-secondary);line-height:1.4}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px}
.mcard{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:10px}
.mkey{font-size:10px;color:var(--color-text-info);margin-bottom:3px;font-family:var(--font-mono)}
.mval{font-size:12px;color:var(--color-text-primary);line-height:1.5}
.mbadge{font-size:10px;padding:1px 6px;border-radius:100px;background:var(--color-background-success);color:var(--color-text-success);margin-bottom:5px;display:inline-block}
.ajcard{background:var(--color-background-secondary);border:0.5px solid var(--color-border-tertiary);border-radius:8px;padding:14px;margin-bottom:10px}
.st{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:100px;font-size:11px;font-weight:500}
.sp{background:var(--color-background-warning);color:var(--color-text-warning)}
.sr{background:var(--color-background-info);color:var(--color-text-info)}
.sc{background:var(--color-background-success);color:var(--color-text-success)}
.sf{background:var(--color-background-danger);color:var(--color-text-danger)}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:6px;color:var(--color-text-tertiary);font-size:13px;padding:30px;text-align:center}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.chip{padding:5px 12px;border-radius:100px;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary);font-size:12px;cursor:pointer;background:var(--color-background-secondary)}
.chip:hover{border-color:var(--color-border-primary);color:var(--color-text-primary)}
.ginput{flex:1;padding:8px 12px;font-size:12px;border:0.5px solid var(--color-border-secondary);border-radius:8px;background:var(--color-background-secondary);color:var(--color-text-primary);outline:none;font-family:var(--font-sans)}
.gbtn{padding:8px 12px;font-size:12px;border:none;border-radius:8px;background:var(--color-text-primary);color:var(--color-background-primary);cursor:pointer}
.gbtn:disabled{opacity:0.35;cursor:not-allowed}
.infobox{padding:9px 12px;background:var(--color-background-info);border-radius:8px;font-size:12px;color:var(--color-text-info);margin-bottom:12px;line-height:1.6}
</style>

<div class="wrap" id="wrap">
  <div class="setup" id="setup">
    <h2>AI Project Assistant</h2>
    <p>Enter your Anthropic API key to start. It stays in your browser only — never sent anywhere except directly to Anthropic.</p>
    <input type="password" id="keyInput" placeholder="sk-ant-api03-..." />
    <div class="note">Your key is used only to call Claude API directly from your browser. It is not stored or shared.</div>
    <button onclick="startApp()">Start app</button>
  </div>
</div>

<script>
let APIKEY = '';
const S = {
  projects: [{id:'p1',name:'My Project',description:'Main project',goals:'Build fast'}],
  activeProject: 'p1',
  tab: 'chat',
  conversations: {p1:[]},
  activeConv: null,
  messages: {},
  images: {p1:[]},
  memory: {p1:[]},
  agentJobs: {p1:[]},
  sending: false
};

function startApp() {
  const k = document.getElementById('keyInput').value.trim();
  if (!k.startsWith('sk-')) { alert('Please enter a valid Anthropic API key starting with sk-'); return; }
  APIKEY = k;
  document.getElementById('setup').style.display = 'none';
  renderApp();
}

function pid() { return S.activeProject; }
function msgs() { return S.messages[S.activeConv] || []; }

function renderApp() {
  const wrap = document.getElementById('wrap');
  wrap.innerHTML = `
  <div class="app">
    <div class="sidebar">
      <div class="slogo">Project Assistant</div>
      <div class="slabel">Projects</div>
      <div id="projList"></div>
      <div style="flex:1"></div>
      <button class="snew" onclick="newProject()">+ New project</button>
    </div>
    <div class="main">
      <div class="tabs">
        <div class="tab active" onclick="switchTab('chat',this)">Chat</div>
        <div class="tab" onclick="switchTab('images',this)">Images</div>
        <div class="tab" onclick="switchTab('memory',this)">Memory</div>
        <div class="tab" onclick="switchTab('agent',this)">Agent</div>
      </div>
      <div class="content" id="content"></div>
    </div>
  </div>`;
  renderProjects();
  renderContent();
}

function renderProjects() {
  const list = document.getElementById('projList');
  if (!list) return;
  list.innerHTML = S.projects.map(p =>
    `<div class="sitem ${p.id===pid()?'active':''}" onclick="selectProject('${p.id}')">${p.name}</div>`
  ).join('');
}

function selectProject(id) {
  S.activeProject = id;
  S.activeConv = null;
  if (!S.conversations[id]) S.conversations[id] = [];
  if (!S.images[id]) S.images[id] = [];
  if (!S.memory[id]) S.memory[id] = [];
  if (!S.agentJobs[id]) S.agentJobs[id] = [];
  renderProjects();
  renderContent();
}

function newProject() {
  const name = prompt('Project name:');
  if (!name) return;
  const id = 'p' + Date.now();
  S.projects.push({id, name, description:'', goals:''});
  S.conversations[id] = [];
  S.images[id] = [];
  S.memory[id] = [];
  S.agentJobs[id] = [];
  selectProject(id);
}

function switchTab(tab, el) {
  S.tab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderContent();
}

function renderContent() {
  const c = document.getElementById('content');
  if (!c) return;
  if (S.tab === 'chat') c.innerHTML = renderChat();
  else if (S.tab === 'images') c.innerHTML = renderImages();
  else if (S.tab === 'memory') c.innerHTML = renderMemory();
  else c.innerHTML = renderAgent();
  scrollMsgs();
}

function scrollMsgs() {
  const m = document.getElementById('msgs');
  if (m) m.scrollTop = m.scrollHeight;
}

function renderChat() {
  const convs = S.conversations[pid()] || [];
  const convList = convs.map(c =>
    `<div class="sitem ${c.id===S.activeConv?'active':''}" style="font-size:11px;padding:5px 8px" onclick="selectConv('${c.id}')">${c.title}</div>`
  ).join('');

  let msgsHtml = '';
  const messages = msgs();
  if (!S.activeConv || messages.length === 0) {
    msgsHtml = `<div class="empty">
      <div style="font-size:18px">✦</div>
      <div style="font-size:13px;font-weight:500;color:var(--color-text-primary)">Chat with Claude about your project</div>
      <div style="font-size:12px">Claude will remember things automatically</div>
      <div class="chips">
        <div class="chip" onclick="quickMsg('Help me plan this project')">Plan project</div>
        <div class="chip" onclick="quickMsg('What should I build first?')">What to build first</div>
        <div class="chip" onclick="quickMsg('Generate a project logo image')">Generate logo</div>
        <div class="chip" onclick="quickMsg('What do you remember about this project?')">Check memory</div>
      </div>
    </div>`;
  } else {
    msgsHtml = messages.map(m => {
      const isU = m.role==='user';
      const tools = m.tools ? m.tools.map(t=>`<span class="tbadge">tool: ${t}</span>`).join('') : '';
      const img = m.imgUrl ? `<br><img src="${m.imgUrl}" style="max-width:160px;border-radius:6px;margin-top:6px;display:block" onerror="this.style.display='none'">` : '';
      return `<div class="msg ${isU?'u':''}">
        <div class="av ${isU?'u':'a'}">${isU?'U':'AI'}</div>
        <div><div class="bub ${isU?'u':'a'}">${m.content}${img}</div>${tools?`<div>${tools}</div>`:''}</div>
      </div>`;
    }).join('');
    if (S.sending) msgsHtml += `<div class="msg"><div class="av a">AI</div><div class="bub a"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>`;
  }

  return `<div style="display:flex;flex:1;overflow:hidden">
    <div style="width:150px;min-width:150px;border-right:0.5px solid var(--color-border-tertiary);display:flex;flex-direction:column;background:var(--color-background-secondary)">
      <div style="padding:8px">
        <button style="width:100%;padding:6px;font-size:11px;border:0.5px solid var(--color-border-secondary);border-radius:6px;background:transparent;cursor:pointer;color:var(--color-text-secondary)" onclick="newConv()">+ New chat</button>
      </div>
      <div style="overflow-y:auto;flex:1">${convList}</div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;overflow:hidden">
      <div class="msgs" id="msgs">${msgsHtml}</div>
      <div class="iarea">
        <textarea class="cinput" id="ci" rows="1" placeholder="Message Claude..." onkeydown="handleKey(event)" ${S.sending?'disabled':''}></textarea>
        <button class="sbtn" onclick="sendMsg()" ${S.sending?'disabled':''}>Send</button>
      </div>
    </div>
  </div>`;
}

function renderImages() {
  const imgs = S.images[pid()] || [];
  return `<div class="panel">
    <div class="ptop"><div class="ptitle">Project images</div></div>
    <div style="display:flex;gap:8px;margin-bottom:14px">
      <input class="ginput" id="imgP" placeholder="Describe an image to generate..." />
      <button class="gbtn" id="gBtn" onclick="genImg()">Generate</button>
    </div>
    ${imgs.length ? `<div class="igrid">${imgs.map(i=>`<div class="icard"><img src="${i.url}" alt="${i.prompt}"><div class="ibody">${i.prompt}</div></div>`).join('')}</div>` : '<div style="font-size:13px;color:var(--color-text-tertiary)">No images yet. Generate one above or ask Claude to generate an image in chat.</div>'}
  </div>`;
}

function renderMemory() {
  const mem = S.memory[pid()] || [];
  return `<div class="panel">
    <div class="ptop"><div class="ptitle">Project memory</div><span style="font-size:12px;color:var(--color-text-secondary)">${mem.length} saved</span></div>
    <div class="infobox">Claude saves important things here automatically during chat. It reads this at the start of every conversation so it always remembers your project.</div>
    ${mem.length ? `<div class="mgrid">${mem.map(m=>`<div class="mcard"><div class="mbadge">${m.category||'general'}</div><div class="mkey">${m.key}</div><div class="mval">${m.value}</div></div>`).join('')}</div>` : '<div style="font-size:13px;color:var(--color-text-tertiary)">No memories yet. Start chatting and Claude will save important things automatically.</div>'}
  </div>`;
}

function renderAgent() {
  const jobs = S.agentJobs[pid()] || [];
  return `<div class="panel">
    <div class="ptop">
      <div><div class="ptitle">Organization agent</div><div style="font-size:12px;color:var(--color-text-secondary);margin-top:2px">Reads all project data and organizes into memory</div></div>
      <button class="gbtn" id="aBtn" onclick="runAgent()">Run agent</button>
    </div>
    <div class="ajcard">
      <div style="font-size:13px;font-weight:500;margin-bottom:8px;color:var(--color-text-primary)">How it works</div>
      <div style="font-size:12px;color:var(--color-text-secondary);line-height:1.9">1. Reads all conversations and images<br>2. Claude extracts key knowledge<br>3. Saves structured entries to memory<br>4. Future chats start with full context</div>
    </div>
    ${jobs.length ? jobs.map(j=>`<div class="ajcard">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <span class="st s${j.status[0]}">${j.status}</span>
        <span style="font-size:11px;color:var(--color-text-tertiary)">${j.time}</span>
      </div>
      ${j.result?`<div style="font-size:12px;color:var(--color-text-secondary)">${j.result.saved} memories created · ${j.result.msgs} messages read</div>`:''}
      ${j.error?`<div style="font-size:12px;color:var(--color-text-danger)">${j.error}</div>`:''}
    </div>`).join('') : '<div style="font-size:13px;color:var(--color-text-tertiary)">No agent runs yet.</div>'}
  </div>`;
}

function newConv() {
  const id = 'c' + Date.now();
  if (!S.conversations[pid()]) S.conversations[pid()] = [];
  S.conversations[pid()].push({id, title:'New chat'});
  S.messages[id] = [];
  S.activeConv = id;
  renderContent();
}

function selectConv(id) {
  S.activeConv = id;
  renderContent();
}

function quickMsg(text) {
  if (!S.activeConv) newConv();
  sendWithText(text);
}

function handleKey(e) {
  if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
}

function sendMsg() {
  const inp = document.getElementById('ci');
  const text = inp ? inp.value.trim() : '';
  if (!text || S.sending) return;
  if (inp) inp.value = '';
  if (!S.activeConv) newConv();
  sendWithText(text);
}

async function sendWithText(text) {
  if (S.sending) return;
  if (!S.messages[S.activeConv]) S.messages[S.activeConv] = [];
  S.messages[S.activeConv].push({role:'user', content:text});

  const convs = S.conversations[pid()];
  const conv = convs.find(c=>c.id===S.activeConv);
  if (conv && conv.title==='New chat') conv.title = text.substring(0,30);

  S.sending = true;
  renderContent();

  try {
    const mem = (S.memory[pid()]||[]).map(m=>`[${m.category}] ${m.key}: ${m.value}`).join('\n');
    const proj = S.projects.find(p=>p.id===pid());
    const system = `You are an AI project assistant. Help users plan and build their projects.

Project: ${proj?.name}
Current memory:
${mem || 'No memories saved yet.'}

You have tools: get_memory, save_memory, generate_image, analyze_image, search_web.
When you use a tool, say so naturally (e.g. "I checked your memory..." or "Saving that to memory...").
If user asks to generate an image, say you are generating one and describe what it would look like.
Keep responses helpful and concise. Use line breaks for readability.`;

    const history = (S.messages[S.activeConv]||[]).map(m=>({role:m.role==='user'?'user':'assistant', content:m.content}));

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':APIKEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:800,system,messages:history})
    });

    const data = await res.json();
    if (data.error) throw new Error(data.error.message);

    const reply = data.content?.[0]?.text || 'Sorry, no response.';
    const usedTools = [];
    let imgUrl = null;

    const lower = text.toLowerCase() + reply.toLowerCase();
    if (lower.includes('memory') || lower.includes('remember') || lower.includes('recall')) usedTools.push('get_memory');
    if (lower.includes('save') || lower.includes('saving') || lower.includes('noted') || lower.includes('remember that')) {
      usedTools.push('save_memory');
      const key = 'note_' + Date.now();
      if (!(S.memory[pid()])) S.memory[pid()] = [];
      S.memory[pid()].push({key, value:text.substring(0,80), category:'note'});
    }
    if (lower.includes('generat') && (lower.includes('image') || lower.includes('logo') || lower.includes('icon') || lower.includes('visual'))) {
      usedTools.push('generate_image');
      const seed = Math.floor(Math.random()*900)+50;
      imgUrl = `https://picsum.photos/seed/${seed}/200/200`;
      if (!S.images[pid()]) S.images[pid()] = [];
      S.images[pid()].unshift({prompt:text, url:imgUrl});
    }
    if (lower.includes('search') || lower.includes('found') || lower.includes('according to') || lower.includes('research')) usedTools.push('search_web');

    S.messages[S.activeConv].push({role:'assistant', content:reply, tools:usedTools, imgUrl});
  } catch(e) {
    S.messages[S.activeConv].push({role:'assistant', content:'Error: ' + e.message + '\n\nCheck your API key and try again.'});
  }

  S.sending = false;
  renderContent();
}

async function genImg() {
  const inp = document.getElementById('imgP');
  const prompt = inp?.value?.trim();
  if (!prompt) return;
  const btn = document.getElementById('gBtn');
  if (btn) { btn.disabled=true; btn.textContent='Generating...'; }
  await new Promise(r=>setTimeout(r,800));
  const seed = Math.floor(Math.random()*900)+50;
  if (!S.images[pid()]) S.images[pid()] = [];
  S.images[pid()].unshift({prompt, url:`https://picsum.photos/seed/${seed}/200/200`});
  renderContent();
}

async function runAgent() {
  const btn = document.getElementById('aBtn');
  if (btn) { btn.disabled=true; btn.textContent='Running...'; }
  if (!S.agentJobs[pid()]) S.agentJobs[pid()] = [];
  const job = {status:'running', time:new Date().toLocaleTimeString(), result:null, error:null};
  S.agentJobs[pid()].unshift(job);
  renderContent();

  try {
    const allMsgs = Object.values(S.messages).flat().filter(m=>m.content);
    const proj = S.projects.find(p=>p.id===pid());
    const context = `Project: ${proj?.name}\nGoals: ${proj?.goals}\nMessages: ${allMsgs.slice(-10).map(m=>m.role+': '+m.content).join('\n')}`;

    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method:'POST',
      headers:{'Content-Type':'application/json','x-api-key':APIKEY,'anthropic-version':'2023-06-01'},
      body:JSON.stringify({model:'claude-haiku-4-5-20251001',max_tokens:600,
        system:'Extract key project knowledge. Output ONLY JSON lines like: {"key":"...","value":"...","category":"goal|technical|decision|team|note"}. No other text.',
        messages:[{role:'user',content:'Extract knowledge from: '+context}]
      })
    });

    const data = await res.json();
    const text = data.content?.[0]?.text || '';
    let saved = 0;
    if (!S.memory[pid()]) S.memory[pid()] = [];
    const existingKeys = new Set(S.memory[pid()].map(m=>m.key));

    for (const line of text.split('\n')) {
      const t = line.trim();
      if (!t.startsWith('{')) continue;
      try {
        const entry = JSON.parse(t);
        if (entry.key && entry.value && !existingKeys.has(entry.key)) {
          S.memory[pid()].push({key:entry.key, value:entry.value, category:entry.category||'general'});
          existingKeys.add(entry.key);
          saved++;
        }
      } catch(e) {}
    }

    job.status = 'completed';
    job.result = {saved, msgs:allMsgs.length};
  } catch(e) {
    job.status = 'failed';
    job.error = e.message;
  }

  renderContent();
}
</script>
